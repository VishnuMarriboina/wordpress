; Appended to the vercel-php runtime php.ini (mirrors config/php.ini where Vercel allows it).
; Vercel caps request bodies at 4.5 MB, so larger uploads are not possible through the function.
memory_limit = 512M
max_execution_time = 60
max_input_vars = 3000
upload_max_filesize = 4M
post_max_size = 4M
display_errors = Off
log_errors = On
error_log = /dev/stderr
